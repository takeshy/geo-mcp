steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, '-f', Dockerfile, '-t', 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/geo-home/geo-home-mcp:shared-vm-${BUILD_ID}', '.']
  - name: gcr.io/cloud-builders/docker
    args: [push, 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/geo-home/geo-home-mcp:shared-vm-${BUILD_ID}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - compute
      - ssh
      - shared-apps
      - --project=geminihub-486523
      - --zone=asia-northeast1-b
      - --tunnel-through-iap
      - --ssh-key-file=/tmp/build-ssh
      - --quiet
      - --command
      - 'sudo python3 /opt/shared-apps/deploy.py --app geo --image asia-northeast1-docker.pkg.dev/${PROJECT_ID}/geo-home/geo-home-mcp:shared-vm-${BUILD_ID}'
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
